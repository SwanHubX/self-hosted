global:
  checkNewVersion: false
  sendAnonymousUsage: false
entryPoints:
  web:
    address: ":80"
  internal:
    address: ":8080"
  traefik:
    address: ":8081"
ping:
  entryPoint: traefik
providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: vector-dual-test
    constraints: "Label(`com.docker.compose.project`, `vector-dual-test`)"
