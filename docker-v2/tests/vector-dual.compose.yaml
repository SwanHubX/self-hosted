# Integration overrides: no published ports, isolated gateway, existing ClickHouse only.
networks:
  swanlab-net:
    name: vector-dual-test
  data-services:
    external: true
    name: ${VECTOR_TEST_DATA_NETWORK:-swanlab-net}

services:
  gateway:
    ports: !reset []
    depends_on: !reset {}
    volumes:
      - ./tests/traefik.vector-test.yaml:/etc/traefik/traefik.yaml:ro
  vector-1:
    restart: "no"
    depends_on: !reset {}
    networks: [swanlab-net, data-services]
    environment:
      CLICKHOUSE_HOST: ${VECTOR_TEST_CLICKHOUSE_HOST:?Set the existing ClickHouse container name}
    volumes:
      - ${VECTOR_TEST_ROOT:?Set an isolated test directory}/data/vector:/var/lib/vector
  vector-2:
    restart: "no"
    depends_on: !reset {}
    networks: [swanlab-net, data-services]
    environment:
      CLICKHOUSE_HOST: ${VECTOR_TEST_CLICKHOUSE_HOST:?Set the existing ClickHouse container name}
    volumes:
      - ${VECTOR_TEST_ROOT:?Set an isolated test directory}/data/vector-2:/var/lib/vector
