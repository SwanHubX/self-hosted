# Vector 共享配置；每个实例必须独占自己的 data_dir 挂载目录
# 数据流：接收 HTTP 指标，按类型分流至 scalar、media、histogram、log 表并写入 ClickHouse
# ClickHouse 连接参数保留 ${} 占位符，由启动时 render.sh 渲染为实际值（0.57 起默认关闭配置内插值）

data_dir: "/var/lib/vector"

api:
  enabled: false

acknowledgements:
  enabled: true

sources:
  http_metrics:
    type: http_server
    address: "0.0.0.0:8686"
    decoding:
      codec: json

  # Vector 自身内部指标（CPU/内存/吞吐/utilization 等）
  internal_metrics:
    type: internal_metrics
    scrape_interval_secs: 30

transforms:
  process_metrics:
    type: remap
    inputs:
      - http_metrics
    source: |
      .ts_obj = parse_timestamp(.time, "%Y-%m-%dT%H:%M:%S.%fZ") ?? now()
      .timestamp = to_unix_timestamp(.ts_obj, unit: "milliseconds")
      del(.time)
      .uid = to_int!(.uid)
      .epoch = to_int!(.epoch)
      if .type != "log" {
        .step = to_int!(.step)
      }
      if .type == "media" {
        .indexing = to_int!(.indexing)
        if is_null(.other) { .other = {} }
      }

  metric_router:
    type: route
    inputs:
      - process_metrics
    route:
      scalar_stream: .type == "scalar"
      media_stream: .type == "media"
      histogram_stream: .type == "histogram"
      log_stream: .type == "log"

  clean_scalar:
    type: remap
    inputs: ["metric_router.scalar_stream"]
    source: 'del(.type); del(.ts_obj)'

  clean_media:
    type: remap
    inputs: ["metric_router.media_stream"]
    source: 'del(.type); del(.ts_obj)'

  clean_histogram:
    type: remap
    inputs: ["metric_router.histogram_stream"]
    source: 'del(.type); del(.ts_obj)'

  clean_log:
    type: remap
    inputs: ["metric_router.log_stream"]
    source: 'del(.type); del(.ts_obj)'

sinks:
  clickhouse_scalar:
    type: clickhouse
    inputs: ["clean_scalar"]
    endpoint: "http://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}"
    database: "${CLICKHOUSE_DB}"
    table: "scalar"
    compression: gzip
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    batch:
      max_events: 10000
      timeout_secs: 5
    buffer:
      type: disk
      # 磁盘缓冲上限 10GiB
      max_size: 10737418240
      when_full: block

  clickhouse_media:
    type: clickhouse
    inputs: ["clean_media"]
    endpoint: "http://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}"
    database: "${CLICKHOUSE_DB}"
    table: "media"
    compression: gzip
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    batch:
      max_events: 10000
      timeout_secs: 5
    buffer:
      type: disk
      max_size: 10737418240
      when_full: block

  clickhouse_histogram:
    type: clickhouse
    inputs: ["clean_histogram"]
    endpoint: "http://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}"
    database: "${CLICKHOUSE_DB}"
    table: "histogram"
    compression: gzip
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    batch:
      max_events: 10000
      timeout_secs: 5
    buffer:
      type: disk
      max_size: 10737418240
      when_full: block

  clickhouse_log:
    type: clickhouse
    inputs: ["clean_log"]
    endpoint: "http://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}"
    database: "${CLICKHOUSE_DB}"
    table: "log"
    compression: gzip
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    batch:
      max_events: 10000
      timeout_secs: 5
    buffer:
      type: disk
      max_size: 10737418240
      when_full: block

  # Prometheus 抓取端点（9090，容器内监听；需要暴露时在 compose 增加端口映射）
  prometheus_exporter:
    type: prometheus_exporter
    inputs:
      - internal_metrics
    address: "0.0.0.0:9090"
    # 指标端点不参与端到端确认，显式关闭以消除启动警告
    acknowledgements:
      enabled: false

  # route 会生成 _unmatched 输出；未命中类型显式丢弃，避免每条启动警告
  discard_unmatched:
    type: blackhole
    inputs: ["metric_router._unmatched"]
